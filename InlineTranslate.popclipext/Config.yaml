#popclip
name: Inline Translate
identifier: io.github.xvusrmqj.inline-translate
description: Translate the selected text and show the result in a popup. In place, no browser, no API key. Local Ollama first (offline), then Bing/Google via translate-shell. Works in mainland China.
icon: circle filled 译
interpreter: bash
shell mode: none
shell script file: translate.sh
after: show-result
requirements: [text]
options:
  - identifier: target
    label: Translate into
    type: multiple
    default value: auto
    values:
      - auto
      - zh-Hans
      - zh-Hant
      - en
      - ja
      - ko
      - de
      - fr
      - es
      - ru
      - pt
  - identifier: engine
    label: Engine
    type: multiple
    default value: auto
    values:
      - auto
      - ollama
      - bing
      - google
  - identifier: model
    label: Ollama model
    type: string
    default value: qwen3.5:0.8b
